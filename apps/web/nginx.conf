server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The frontend and the API answer on the same origin, which is what lets the frontend call a
    # relative path with no base URL variable and no CORS configuration.
    location /api/ {
        # Docker's embedded DNS, re-resolved rather than cached at startup: scaling the api to
        # several replicas must actually spread requests across them. The worker is a separate
        # service, so scaling the api can never produce a second one.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_service http://api:3000;
        proxy_pass $api_service;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # A single-page app: every other path serves the app itself.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
