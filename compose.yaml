# The whole stack: Postgres, the api, the Sweep Worker, and a reverse proxy serving the built frontend.
#
# Nothing here migrates or seeds the database. Both steps are run explicitly from the host against
# the published Postgres port, and the api and the Sweep Worker fail fast with an instruction naming
# the step that was skipped — see docs/running.md.
#
# The dev frontend is deliberately NOT containerised: run it on the host with `npm run dev
# --workspace @planetinha/web`, which proxies the API path to this stack and keeps hot module reloading.
services:
  postgres:
    image: postgres:18.3-alpine
    environment:
      POSTGRES_USER: planetinha
      POSTGRES_PASSWORD: planetinha
      POSTGRES_DB: planetinha
    # Published so migrations and the seed can be run from the host, which is the only way they
    # are ever run — no service migrates as a side effect of starting.
    ports:
      - '5432:5432'
    volumes:
      # A bind mount into .data/ (gitignored) rather than a Docker-managed named volume, so every
      # container's on-disk state lives under one directory at the repo root instead of scattered
      # in Docker's own storage area.
      - ./.data/postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U planetinha -d planetinha']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: npm run start
    # Everything this container needs, in one place — see docker.env.example. DATABASE_URL in
    # there points at Postgres by service name, unlike the host's apps/api/.env, which points at
    # the published port: two values on purpose, kept apart so neither context can read the
    # other's (see docs/running.md).
    env_file: docker.env
    # No published port: everything reaches the api through the proxy, on one address. That is
    # also what lets `docker compose up --scale api=3` work without a host port collision.
    expose:
      - '3000'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Cheap enough to run every few seconds: the health endpoint reads no Snapshot, Forecast,
      # or Grid Point.
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  sweep-worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    # The same image as the api, differing only by this line. The Sweep Worker is its own service
    # and is never scaled: exactly one process may make upstream calls, because the whole Budget
    # accounting rests on there being a single accountable caller.
    command: npm run worker:sweep
    env_file: docker.env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  proxy:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '8080:80'
    depends_on:
      - api
    restart: unless-stopped
