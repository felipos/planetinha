services:
  postgres:
    image: postgres:18.3-alpine
    environment:
      POSTGRES_USER: vento
      POSTGRES_PASSWORD: vento
      POSTGRES_DB: vento
    # Published so migrations and the seed can be run from the host, which is the only way they
    # are ever run — no service migrates as a side effect of starting.
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vento -d vento']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
